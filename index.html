<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ملوك الشحن - العجلة الذهبية</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle at 10% 30%, #0a2f2a, #030c0a);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Cairo', 'Tajawal', 'Segoe UI', system-ui, sans-serif;
            padding: 20px;
        }

        .gold-container {
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(12px);
            border-radius: 80px;
            padding: 25px 25px 40px;
            box-shadow: 0 30px 50px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,215,0,0.5);
            border: 1px solid rgba(255, 200, 70, 0.6);
            max-width: 550px;
            width: 100%;
        }

        .title-main {
            text-align: center;
            font-size: 2.4rem;
            font-weight: 900;
            background: linear-gradient(135deg, #FFE6B0, #FFB347, #FFD966);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 5px rgba(0,0,0,0.4);
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .title-shadow {
            text-align: center;
            font-size: 1rem;
            color: #FFDD99;
            background: #2c2618aa;
            display: inline-block;
            width: auto;
            margin: 0 auto 20px;
            padding: 6px 22px;
            border-radius: 40px;
            font-weight: bold;
            backdrop-filter: blur(4px);
        }

        .wheel-area {
            position: relative;
            width: 340px;
            height: 340px;
            margin: 0 auto;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100% !important;
            height: 100% !important;
            border-radius: 50%;
            box-shadow: 0 0 0 8px #e9b13b, 0 0 0 14px #7a4c0e, 0 20px 35px black;
        }

        .pointer {
            position: absolute;
            top: -32px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 26px solid transparent;
            border-right: 26px solid transparent;
            border-top: 58px solid #f3b33d;
            filter: drop-shadow(0 8px 8px rgba(0,0,0,0.5));
            z-index: 15;
        }

        .pointer::before {
            content: "⚡";
            position: absolute;
            top: -70px;
            left: -19px;
            font-size: 38px;
            color: #ffdd88;
            text-shadow: 0 0 4px darkorange;
            font-weight: bold;
        }

        .spin-wrapper {
            text-align: center;
            margin-top: 50px;
        }

        .spin-btn {
            background: radial-gradient(circle at 30% 25%, #ffcd7e, #cf7f1a);
            border: none;
            font-size: 2.2rem;
            font-weight: 800;
            font-family: inherit;
            padding: 14px 40px;
            border-radius: 80px;
            color: #2c1c04;
            cursor: pointer;
            box-shadow: 0 10px 0 #6a3e0b;
            transition: 0.08s linear;
            width: 260px;
            letter-spacing: 3px;
        }

        .spin-btn:active {
            transform: translateY(5px);
            box-shadow: 0 5px 0 #6a3e0b;
        }

        .spin-btn:disabled {
            opacity: 0.65;
            transform: translateY(0);
            cursor: not-allowed;
            filter: grayscale(0.15);
        }

        .result-card {
            background: #000000aa;
            backdrop-filter: blur(20px);
            margin-top: 30px;
            padding: 16px 12px;
            border-radius: 60px;
            font-size: 1.7rem;
            font-weight: bold;
            text-align: center;
            color: #FFE5A3;
            border: 1px solid #f5bc70;
            word-break: break-word;
            line-height: 1.3;
        }

        .spark-text {
            font-size: 0.9rem;
            margin-top: 12px;
            color: #ffd58c;
            background: #2a2418;
            display: inline-block;
            padding: 4px 18px;
            border-radius: 30px;
        }

        .info-text {
            font-size: 0.8rem;
            margin-top: 8px;
            color: #88ffaa;
            background: #1a2a1aaa;
            padding: 5px 12px;
            border-radius: 20px;
        }

        @media (max-width: 500px) {
            .wheel-area { width: 280px; height: 280px; }
            .title-main { font-size: 1.9rem; }
            .spin-btn { font-size: 1.7rem; width: 220px; }
            .result-card { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
<div class="gold-container">
    <div class="title-main">👑 مـلــوك الـشــحــن 👑</div>
    <div style="text-align: center;">
        <div class="title-shadow">🎁 ليك فُرصة عَلَى كُل شحنة تشحنها 🎁</div>
    </div>

    <div class="wheel-area">
        <canvas id="wheelCanvas" width="600" height="600"></canvas>
        <div class="pointer"></div>
    </div>

    <div class="spin-wrapper">
        <button class="spin-btn" id="spinBtn">🌀 دَوِّر الحَظ 🌀</button>
        <div id="resultMessage" class="result-card">✨ إضغط دَوِّر و اكسب جوايز خرافية ✨</div>
        <div class="spark-text">💥 جائزة كبرى iPhone 7 💥</div>
        <div id="codeStatus" class="info-text"></div>
    </div>
</div>

<script>
    (function(){
        // ============================================================
        // الجوائز الحقيقية (لا يوجد ايفون 7 بينهم)
        // ============================================================
        const SEGMENTS = [
            { name: "💎 VIP 6",      prizeId: "vip6",     display: "💎 VIP 6" },
            { name: "💰 1000 Coins", prizeId: "1000c",    display: "💰 1000 عملة ذهبية" },
            { name: "👑 VIP 5",      prizeId: "vip5",     display: "👑 VIP 5" },
            { name: "💎 VIP 4",      prizeId: "vip4",     display: "💎 VIP 4" },
            { name: "🔥 5000 Coins", prizeId: "5000c",    display: "🔥 5000 عملة ذهبية" },
            { name: "⭐ 10000 Coins",prizeId: "10000c",   display: "⭐ 10000 عملة ذهبية" },
            { name: "💎 VIP 6",      prizeId: "vip6",     display: "💎 VIP 6" },
            { name: "💰 1000 Coins", prizeId: "1000c",    display: "💰 1000 عملة ذهبية" }
        ];

        const TAB_TITLE_MAP = {
            "vip6": "🎁 هديتك: VIP 6",
            "1000c": "🎁 هديتك: 1000 عملة",
            "vip5": "🎁 هديتك: VIP 5",
            "vip4": "🎁 هديتك: VIP 4",
            "5000c": "🎁 هديتك: 5000 عملة",
            "10000c": "🎁 هديتك: 10000 عملة"
        };

        const DISPLAY_MAP = {
            "vip6": "💎 VIP 6",
            "1000c": "💰 1000 عملة ذهبية",
            "vip5": "👑 VIP 5",
            "vip4": "💎 VIP 4",
            "5000c": "🔥 5000 عملة ذهبية",
            "10000c": "⭐ 10000 عملة ذهبية"
        };

        const COLORS = ["#E63946", "#F7B05E", "#2A9D8F", "#E9C46A", "#6A9C89", "#F4A261", "#E76F51", "#43AA8B"];

        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const spinBtn = document.getElementById('spinBtn');
        const resultDiv = document.getElementById('resultMessage');
        const codeStatus = document.getElementById('codeStatus');

        let currentRotation = 0;
        let spinning = false;
        let animId = null;
        let spinStart = 0;
        const DURATION = 3800;
        let finalRotation = 0;

        // ============================================================
        // نظام الكود الفريد (مرة واحدة لكل شحنة)
        // التخزين: localStorage للكود المستخدم
        // ============================================================
        
        // الحصول على الكود من رابط الصفحة (مثال: ?code=ABC123)
        function getCodeFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('code');
        }

        // التحقق من صلاحية الكود (هل استخدم من قبل؟)
        function isCodeValid(code) {
            if (!code) return false;
            const usedCodes = JSON.parse(localStorage.getItem('used_codes') || '{}');
            // نتحقق إذا الكود موجود ومستخدم
            if (usedCodes[code] === true) {
                return false; // الكود استخدم قبل كده
            }
            return true; // الكود جديد وصالح
        }

        // تسجيل الكود كمستخدم
        function markCodeAsUsed(code) {
            if (!code) return;
            const usedCodes = JSON.parse(localStorage.getItem('used_codes') || '{}');
            usedCodes[code] = true;
            localStorage.setItem('used_codes', JSON.stringify(usedCodes));
        }

        // إظهار حالة الكود للمستخدم
        function displayCodeStatus() {
            const code = getCodeFromURL();
            if (!code) {
                codeStatus.innerHTML = "⚠️ لا يوجد كود صالح! هذه الفرصة غير متاحة ⚠️";
                codeStatus.style.color = "#ff8888";
                spinBtn.disabled = true;
                spinBtn.innerText = "🔒 رابط غير صالح 🔒";
                return "invalid";
            }
            
            if (!isCodeValid(code)) {
                codeStatus.innerHTML = "❌ هذا الرابط تم استخدامه بالفعل! كل شحنة لها مرة واحدة فقط ❌";
                codeStatus.style.color = "#ff8888";
                spinBtn.disabled = true;
                spinBtn.innerText = "🔒 استُخدمت الفرصة 🔒";
                return "used";
            }
            
            codeStatus.innerHTML = "✅ كود صالح! لك فرصة واحدة على هذه الشحنة ✅";
            codeStatus.style.color = "#aaffaa";
            return "valid";
        }

        // فتح تبويب باسم الجائزة
        function openPrizeTab(prizeId) {
            const tabTitle = TAB_TITLE_MAP[prizeId] || `🎁 هديتك: ${prizeId}`;
            const newWindow = window.open('about:blank', tabTitle, 'width=500,height=400');
            if (newWindow) {
                newWindow.document.write(`
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <meta charset="UTF-8">
                        <title>${tabTitle}</title>
                        <style>
                            body {
                                background: linear-gradient(135deg, #1a472a, #0a1f1a);
                                display: flex;
                                justify-content: center;
                                align-items: center;
                                height: 100vh;
                                font-family: 'Cairo', 'Segoe UI', sans-serif;
                                margin: 0;
                                text-align: center;
                                color: #FFD966;
                            }
                            .prize-box {
                                background: rgba(0,0,0,0.8);
                                padding: 40px;
                                border-radius: 50px;
                                border: 2px solid gold;
                                box-shadow: 0 0 50px rgba(255,215,0,0.3);
                            }
                            h1 { font-size: 2.5rem; margin-bottom: 20px; }
                            p { font-size: 1.3rem; }
                            .emoji-big { font-size: 5rem; }
                        </style>
                    </head>
                    <body>
                        <div class="prize-box">
                            <div class="emoji-big">🎉</div>
                            <h1>${DISPLAY_MAP[prizeId] || prizeId}</h1>
                            <p>تهانينا من ملوك الشحن! 🎊</p>
                            <p>شكراً لشحنك معنا</p>
                        </div>
                    </body>
                    </html>
                `);
                newWindow.document.close();
            } else {
                alert(`لقد ربحت: ${DISPLAY_MAP[prizeId] || prizeId}`);
            }
        }

        function drawWheel(angleRad) {
            const segCount = SEGMENTS.length;
            const angleStep = (Math.PI * 2) / segCount;
            const centerX = 300, centerY = 300, radius = 290;
            
            for (let i = 0; i < segCount; i++) {
                const start = i * angleStep + angleRad;
                const end = (i + 1) * angleStep + angleRad;
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, start, end);
                ctx.lineTo(centerX, centerY);
                ctx.fillStyle = COLORS[i % COLORS.length];
                ctx.fill();
                ctx.strokeStyle = "#FFD966";
                ctx.lineWidth = 3;
                ctx.stroke();
                
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(start + angleStep / 2);
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.font = "bold 19px 'Cairo', 'Segoe UI'";
                ctx.fillStyle = "#1F2E0E";
                let txt = SEGMENTS[i].name;
                if (txt.length > 12) txt = txt.slice(0,10)+"..";
                ctx.fillText(txt, 190, 8);
                ctx.restore();
            }
            ctx.beginPath();
            ctx.arc(centerX, centerY, 70, 0, Math.PI*2);
            ctx.fillStyle = "#F5C542";
            ctx.fill();
            ctx.fillStyle = "#AD5E0A";
            ctx.font = "bold 33px Tahoma";
            ctx.fillText("🎯", 272, 325);
        }

        function render(angle) {
            drawWheel(angle);
        }

        function getPrizeAtPointer(angleRad) {
            const segCount = SEGMENTS.length;
            const segAngle = (Math.PI * 2) / segCount;
            const fixedPointerAngle = (3 * Math.PI) / 2;
            let rawAngle = angleRad % (Math.PI * 2);
            if (rawAngle < 0) rawAngle += (Math.PI * 2);
            let diff = (fixedPointerAngle - rawAngle + 2 * Math.PI) % (2 * Math.PI);
            let idx = Math.floor(diff / segAngle);
            return SEGMENTS[idx % segCount];
        }

        function animateSpin() {
            if (!spinning) return;
            const now = performance.now();
            const elapsed = now - spinStart;
            if (elapsed >= DURATION) {
                cancelAnimationFrame(animId);
                spinning = false;
                currentRotation = finalRotation % (Math.PI * 2);
                render(currentRotation);
                
                const wonPrize = getPrizeAtPointer(currentRotation);
                resultDiv.innerHTML = `🏆 ${wonPrize.display} 🏆`;
                openPrizeTab(wonPrize.prizeId);
                
                // تسجيل الكود كمستخدم (منع التكرار)
                const code = getCodeFromURL();
                if (code) {
                    markCodeAsUsed(code);
                }
                
                spinBtn.disabled = true;
                spinBtn.innerText = "🎲 تم السحب 🎲";
                codeStatus.innerHTML = "✅ تم استخدام فرصتك بنجاح! ✅";
                return;
            }
            
            let t = elapsed / DURATION;
            let easeOut = 1 - Math.pow(1 - t, 3.5);
            const totalTurns = 8.2 * 2 * Math.PI;
            let currentAnimRot = finalRotation + (totalTurns * (1 - easeOut));
            currentRotation = currentAnimRot;
            render(currentRotation);
            animId = requestAnimationFrame(animateSpin);
        }

        function startWheel() {
            if (spinning) return;
            
            const code = getCodeFromURL();
            if (!code || !isCodeValid(code)) {
                resultDiv.innerHTML = "⚠️ هذا الرابط غير صالح أو تم استخدامه ⚠️";
                return;
            }
            
            const randomSegment = Math.floor(Math.random() * SEGMENTS.length);
            const segCount = SEGMENTS.length;
            const segAngle = (Math.PI * 2) / segCount;
            const pointerFixed = (3 * Math.PI) / 2;
            const targetMidAngle = (pointerFixed - (randomSegment * segAngle + segAngle/2) + 2 * Math.PI) % (2 * Math.PI);
            finalRotation = targetMidAngle;
            
            spinning = true;
            spinBtn.disabled = true;
            spinStart = performance.now();
            animateSpin();
        }

        function init() {
            currentRotation = 0.2;
            render(currentRotation);
            
            const status = displayCodeStatus();
            if (status === "valid") {
                spinBtn.addEventListener('click', startWheel);
            }
        }

        init();
    })();
</script>
</body>
</html>
